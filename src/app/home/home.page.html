<ion-header>
  <ion-toolbar>
    <ion-title>Sass en Ionic</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <!-- Contenedor principal: todos sus estilos están anidados bajo .home en home.page.scss -->
  <section class="home">

    <!-- 1. Título: rojo, mayúsculas y centrado -->
    <h1 class="home__titulo">Diseño con Sass</h1>

    <!-- 2. Botón: alineado a la derecha y en azul -->
    <div class="home__acciones">
      <ion-button class="home__boton">Pulsar</ion-button>
    </div>

    <!-- 3. Imagen: centrada con borde verde de 3px -->
    <img class="home__imagen" src="assets/imagen-sass.png" alt="Ionic + Sass">

  </section>
</ion-content>
